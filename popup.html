<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bluesky Follow Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>🦋 Bluesky Follow Assistant</h1>
    <p class="sub">Max 50 automatic follows per run</p>
  </header>

  <div class="actions">
    <button id="btnCollect" class="btn secondary">Collect accounts</button>
    <button id="btnFollow" class="btn primary">Start automatic follow (up to 50)</button>
  </div>

  <div id="status" class="status">Ready.</div>

  <div class="summary">
    <strong id="count">0</strong> accounts in list
  </div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Search…">
    <button id="btnClear" class="btn text">Clear list</button>
  </div>

  <main id="list"></main>

  <footer>
    <span><i class="dot followed"></i> Followed</span>
    <span><i class="dot requested"></i> Requested</span>
    <span><i class="dot new"></i> Not followed</span>
    <span><i class="dot unconfirmed"></i> Unconfirmed</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
